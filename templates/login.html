{% extends "base.html" %}

{% block title %}Login | JobTrack Pro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-dark border-secondary shadow-lg p-4" style="border-radius: 14px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                <p class="text-secondary small">Sign in to access your private job tracker</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label text-light small">Username</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="username" name="username" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-light small">Password</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" required>
                </div>

                <button type="submit" class="btn w-100 fw-semibold text-white py-2" style="background-color: #7c3aed;">
                    Log In
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-secondary small mb-0">
                    Don't have an account?
                    <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold" style="color: #a78bfa;">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
