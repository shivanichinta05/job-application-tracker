{% extends "base.html" %}

{% block title %}Sign Up | JobTrack Pro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-dark border-secondary shadow-lg p-4" style="border-radius: 14px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-white mb-1">Create Account</h3>
                <p class="text-secondary small">Start tracking your job applications privately</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label text-light small">Username</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="username" name="username" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-light small">Password</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-light small">Confirm Password</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="confirm_password" name="confirm_password" required>
                </div>

                <button type="submit" class="btn btn-custom-indigo w-100 fw-semibold py-2">
                    Sign Up
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-secondary small mb-0">
                    Already have an account?
                    <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold" style="color: #3b82f6;">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
